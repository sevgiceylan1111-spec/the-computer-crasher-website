```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Popup Launcher</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#ff3333;
    font-family:"Courier New",monospace;
}

#ui{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:15px;
}

h1{
    margin:0;
    font-size:24px;
    text-shadow:0 0 12px red;
}

button{
    padding:12px 24px;
    background:#f33;
    color:#000;
    border:0;
    border-radius:4px;
    font-weight:bold;
    cursor:pointer;
}

#stop{
    background:#222;
    color:#f33;
    border:1px solid #f33;
}

#status{
    text-align:center;
    max-width:90%;
}
</style>
</head>

<body>

<div id="ui">
    <h1>POPUP LAUNCHER</h1>

    <div>
        <button onclick="start()">START</button>
        <button id="stop" onclick="stop()">STOP & CLOSE</button>
    </div>

    <div id="status">Status: Ready.</div>
</div>

<script>
const MAX_POPUPS = 8;
const popups = [];
let running = false;

function popupHTML(){
    return `
<!DOCTYPE html>
<html>
<head>
<title>⚠ SYSTEM</title>
<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
}
.box{
    width:100%;
    height:100%;
    box-sizing:border-box;
    border:3px double red;
    color:red;
    font-family:"Courier New",monospace;
    font-weight:bold;
    box-shadow:0 0 20px red;
}
.bar{
    background:red;
    color:#000;
    padding:6px;
    font:12px Arial;
}
.msg{
    padding:18px;
}
</style>
</head>
<body>
<div class="box">
    <div class="bar">⚠ CRITICAL ERROR</div>
    <div class="msg">SYSTEM FAILURE DETECTED</div>
</div>
</body>
</html>`;
}

function spawn(){
    if(!running || popups.length >= MAX_POPUPS)
        return;

    const width=300;
    const height=160;

    const x=Math.floor(
        Math.random()*Math.max(1,screen.availWidth-width)
    );

    const y=Math.floor(
        Math.random()*Math.max(1,screen.availHeight-height)
    );

    const w=window.open(
        "",
        "_blank",
        `width=${width},height=${height},left=${x},top=${y},resizable=no`
    );

    if(!w){
        running=false;
        document.getElementById("status").textContent =
            "⚠ POPUPS BLOCKED — allow popups for this site, then press START again.";
        return;
    }

    w.document.write(popupHTML());
    w.document.close();

    const obj={
        w:w,
        x:x,
        y:y,
        vx:(3+Math.random()*4)*(Math.random()<.5?-1:1),
        vy:(3+Math.random()*4)*(Math.random()<.5?-1:1)
    };

    popups.push(obj);

    document.getElementById("status").textContent =
        `✓ POPUPS OPEN: ${popups.length}/${MAX_POPUPS}`;

    bounce(obj);
}

function bounce(p){
    if(!p.w || p.w.closed)
        return;

    const maxX=Math.max(0,screen.availWidth-(p.w.outerWidth||300));
    const maxY=Math.max(0,screen.availHeight-(p.w.outerHeight||160));

    p.x+=p.vx;
    p.y+=p.vy;

    if(p.x<=0 || p.x>=maxX){
        p.vx*=-1;
        p.x=Math.max(0,Math.min(p.x,maxX));
    }

    if(p.y<=0 || p.y>=maxY){
        p.vy*=-1;
        p.y=Math.max(0,Math.min(p.y,maxY));
    }

    try{
        p.w.moveTo(Math.round(p.x),Math.round(p.y));
    }catch(e){}

    setTimeout(()=>bounce(p),30);
}

function start(){
    stop(false);
    running=true;

    /* First popup is directly caused by the button click. */
    spawn();

    /* Additional popups appear gradually. */
    let created=1;

    const timer=setInterval(()=>{
        if(!running || created>=MAX_POPUPS){
            clearInterval(timer);
            return;
        }

        spawn();
        created++;
    },700);
}

function stop(update=true){
    running=false;

    while(popups.length){
        const p=popups.pop();

        try{
            if(p.w && !p.w.closed)
                p.w.close();
        }catch(e){}
    }

    if(update){
        document.getElementById("status").textContent =
            "Status: Stopped.";
    }
}
</script>

</body>
</html>
