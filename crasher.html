<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popup Launcher Matrix</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #ff3333;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }
  #ui {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: radial-gradient(circle, #1a0000 0%, #000 80%);
  }
  h1 {
    margin: 0 0 10px 0;
    font-size: 24px;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #ff0000;
  }
  .controls {
    display: flex;
    gap: 12px;
  }
  button {
    padding: 12px 24px;
    font-size: 16px;
    font-weight: bold;
    font-family: inherit;
    color: #000;
    background: #ff3333;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(255, 0, 0, 0.6);
    transition: all 0.2s ease;
  }
  button:hover {
    background: #ff6666;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.9);
    transform: scale(1.05);
  }
  button.secondary {
    background: #333;
    color: #ff3333;
    border: 1px solid #ff3333;
    box-shadow: none;
  }
  button.secondary:hover {
    background: #ff3333;
    color: #000;
  }
  #status {
    font-size: 14px;
    text-align: center;
    max-width: 80%;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div id="ui">
  <h1>SYSTEM POPUP LAUNCHER</h1>
  <div class="controls">
    <button onclick="start()">START LAUNCHER</button>
    <button class="secondary" onclick="closePopups()">STOP & CLOSE</button>
  </div>
  <div id="status">Status: Ready.</div>
</div>

<script>
const MAX_POPUPS = 5;
let popups = [];

function start() {
  closePopups();

  let blocked = false;

  for (let i = 0; i < MAX_POPUPS; i++) {
    // Generate randomized initial velocities and positions
    const vx = (Math.random() > 0.5 ? 1 : -1) * (4 + Math.floor(Math.random() * 4));
    const vy = (Math.random() > 0.5 ? 1 : -1) * (3 + Math.floor(Math.random() * 4));
    const startX = 50 + i * 40;
    const startY = 50 + i * 40;

    const w = window.open(
      "",
      `popup_${i}_${Date.now()}`,
      `width=320,height=180,left=${startX},top=${startY},resizable=no`
    );

    if (!w) {
      blocked = true;
      continue;
    }

    popups.push(w);

    w.document.write(`
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚠ SYSTEM ALERT #${i + 1}</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080000;
    color: #ff2222;
    font-family: Arial, sans-serif;
    user-select: none;
  }
  .box {
    height: 100vh;
    border: 3px solid #ff0000;
    box-sizing: border-box;
    box-shadow: inset 0 0 15px #ff0000;
    display: flex;
    flex-direction: column;
  }
  .bar {
    background: #ff0000;
    color: #000;
    padding: 6px 10px;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .msg {
    padding: 16px;
    font: bold 14px "Courier New", monospace;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-grow: 1;
  }
</style>
</head>
<body>
<div class="box">
  <div class="bar">⚠ CRITICAL WARNING #${i + 1}</div>
  <div class="msg">SYSTEM THREAT DETECTED</div>
</div>

<script>
let x = ${startX};
let y = ${startY};
let vx = ${vx};
let vy = ${vy};

function move() {
  const winWidth = window.outerWidth || 320;
  const winHeight = window.outerHeight || 180;
  
  const maxX = screen.availWidth - winWidth;
  const maxY = screen.availHeight - winHeight;

  x += vx;
  y += vy;

  if (x <= 0 || x >= maxX) {
    vx = -vx;
    x = Math.max(0, Math.min(x, maxX));
  }
  if (y <= 0 || y >= maxY) {
    vy = -vy;
    y = Math.max(0, Math.min(y, maxY));
  }

  try {
    window.moveTo(x, y);
  } catch(e) {}

  requestAnimationFrame(move);
}

move();
<\/script>
</body>
</html>
    `);

    w.document.close();
  }

  document.getElementById("status").textContent = blocked
    ? "⚠ SOME POPUPS WERE BLOCKED — Please allow popups for this site in your browser settings."
    : `✓ SUCCESS: Launched ${popups.length} active floating window(s).`;
}

function closePopups() {
  for (const w of popups) {
    try {
      if (w && !w.closed) {
        w.close();
      }
    } catch(e) {}
  }
  popups = [];
  document.getElementById("status").textContent = "Status: Popups closed.";
}
</script>

</body>
</html>
