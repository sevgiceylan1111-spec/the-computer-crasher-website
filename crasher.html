<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Diagnostic</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#f00;
    font-family:"Courier New",monospace;
}

#status{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
}

#bar{
    width:300px;
    height:8px;
    border:1px solid #f00;
}

#fill{
    height:100%;
    width:0;
    background:#f00;
}
</style>
</head>

<body>

<div id="status">
    <div>INITIALIZING SYSTEM...</div>
    <div id="bar"><div id="fill"></div></div>
</div>

<script>
const fill=document.getElementById("fill");

let progress=0;

const loading=setInterval(()=>{
    progress+=5;
    fill.style.width=progress+"%";

    if(progress>=100){
        clearInterval(loading);

        /*
         * Start the visual simulation.
         * It stays in this browser tab and does not
         * create uncontrolled real browser windows.
         */
        location.href="notifacations.html";
    }
},100);
</script>

</body>
</html>
