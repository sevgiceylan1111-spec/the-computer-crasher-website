<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spawn</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

.box{
  position:absolute;
  width:140px;
  height:55px;
  background:#080808;
  border:2px solid red;
  color:red;
  font:bold 13px Arial;
  box-shadow:0 0 12px red;
  display:flex;
  align-items:center;
  justify-content:center;
  will-change:transform;
}
</style>
</head>

<body>

<script>
const boxes=[];
const MAX=20;

function spawn(){
  if(boxes.length>=MAX)return;

  const el=document.createElement("div");
  el.className="box";
  el.textContent="⚠ CRITICAL ERROR";
  document.body.appendChild(el);

  boxes.push({
    el,
    x:Math.random()*(innerWidth-144),
    y:Math.random()*(innerHeight-59),
    vx:(Math.random()*4+2)*(Math.random()<.5?-1:1),
    vy:(Math.random()*4+2)*(Math.random()<.5?-1:1)
  });
}

function move(){
  for(const b of boxes){
    b.x+=b.vx;
    b.y+=b.vy;

    if(b.x<=0 || b.x+144>=innerWidth)
      b.vx*=-1;

    if(b.y<=0 || b.y+59>=innerHeight)
      b.vy*=-1;

    b.el.style.transform=
      `translate(${b.x}px,${b.y}px)`;
  }

  requestAnimationFrame(move);
}

/* Spawn one every 400ms */
setInterval(spawn,400);

spawn();
move();
</script>

</body>
</html>
