```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚠️ SYSTEM CRITICAL ⚠️</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:"Courier New",monospace;
}

#stage{
    position:fixed;
    inset:0;
    overflow:hidden;
}

.popup{
    position:absolute;
    width:320px;
    min-height:145px;
    padding:8px;
    background:#050505;
    color:#ff0000;
    border:3px double #ff0000;
    box-shadow:0 0 22px #ff0000;
    font-weight:bold;
    font-size:14px;
    will-change:transform;
    animation:flash .18s infinite alternate;
}

.title{
    background:#f00;
    color:#000;
    padding:3px 6px;
    font-size:11px;
    letter-spacing:1px;
    margin-bottom:10px;
}

@keyframes flash{
    from{
        filter:brightness(1);
        box-shadow:0 0 18px #f00;
    }
    to{
        filter:brightness(1.8);
        box-shadow:0 0 42px #f00;
    }
}
</style>
</head>

<body>

<div id="stage"></div>

<script>
const stage=document.getElementById("stage");

const messages=[
    "SYSTEM CORRUPTION DETECTED",
    "MANDELA.EXE HAS TAKEN CONTROL",
    "DO NOT LOOK BEHIND YOU",
    "YOUR FILES ARE NO LONGER YOURS",
    "SYSTEM FAILURE IMMINENT",
    "CRITICAL_ERROR: VOID_DETECTED",
    "THERE IS NOT ENOUGH ROOM FOR BOTH OF US",
    "AN UNKNOWN ENTITY IS TRACKING YOUR PATH"
];

const popups=[];
const MAX_POPUPS=30;

function spawn(){
    if(popups.length>=MAX_POPUPS)return;

    const box=document.createElement("div");
    box.className="popup";

    box.innerHTML=
        '<div class="title">✖ CRITICAL ERROR</div>'+
        '<div>'+messages[Math.floor(Math.random()*messages.length)]+'</div>';

    stage.appendChild(box);

    const maxX=Math.max(0,innerWidth-320);
    const maxY=Math.max(0,innerHeight-145);

    const obj={
        el:box,
        x:Math.random()*maxX,
        y:Math.random()*maxY,
        vx:(Math.random()*3+2)*(Math.random()<.5?-1:1),
        vy:(Math.random()*3+2)*(Math.random()<.5?-1:1)
    };

    popups.push(obj);
}

function animate(){
    for(const p of popups){
        const maxX=innerWidth-p.el.offsetWidth;
        const maxY=innerHeight-p.el.offsetHeight;

        p.x+=p.vx;
        p.y+=p.vy;

        if(p.x<=0||p.x>=maxX){
            p.vx*=-1;
            p.x=Math.max(0,Math.min(p.x,maxX));
        }

        if(p.y<=0||p.y>=maxY){
            p.vy*=-1;
            p.y=Math.max(0,Math.min(p.y,maxY));
        }

        p.el.style.transform=
            `translate3d(${p.x}px,${p.y}px,0)`;
    }

    requestAnimationFrame(animate);
}

/* Initial group */
for(let i=0;i<6;i++)spawn();

/* Keep spawning until the safe visual limit */
const spawner=setInterval(()=>{
    spawn();

    if(popups.length>=MAX_POPUPS){
        clearInterval(spawner);
    }
},450);

animate();

window.addEventListener("resize",()=>{
    for(const p of popups){
        p.x=Math.min(p.x,Math.max(0,innerWidth-p.el.offsetWidth));
        p.y=Math.min(p.y,Math.max(0,innerHeight-p.el.offsetHeight));
    }
});
</script>

</body>
</html>
