```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚠️ SYSTEM CRITICAL ⚠️</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#000;
    color:#ff0000;
    font-family:"Courier New",Courier,monospace;
    user-select:none;
}

#stage{
    position:fixed;
    inset:0;
    overflow:hidden;
}

.mandela-box{
    position:absolute;
    width:320px;
    min-height:145px;
    padding:8px;
    background:#050505;
    border:3px double #ff0000;
    box-shadow:0 0 20px #ff0000;
    font-weight:bold;
    font-size:14px;
    will-change:transform;
}

.title-bar{
    background:#ff0000;
    color:#000;
    padding:3px 6px;
    font-size:11px;
    letter-spacing:1px;
    margin-bottom:10px;
}

#payload-text{
    line-height:1.5;
}

.flash{
    animation:flash .16s infinite alternate;
}

@keyframes flash{
    from{
        background:#050505;
        box-shadow:0 0 20px #ff0000;
    }
    to{
        background:#260000;
        box-shadow:0 0 45px #ff0000;
    }
}
</style>
</head>

<body>

<div id="stage">
    <div class="mandela-box flash" id="box">
        <div class="title-bar">✖ CRITICAL ERROR</div>
        <div id="payload-text">INITIALIZING MANDELA.EXE...</div>
    </div>
</div>

<script>
const payloads = [
    "SYSTEM CORRUPTION DETECTED",
    "MANDELA.EXE HAS TAKEN CONTROL",
    "DO NOT LOOK BEHIND YOU",
    "YOUR FILES ARE NO LONGER YOURS",
    "SYSTEM FAILURE IMMINENT",
    "CRITICAL_ERROR: VOID_DETECTED",
    "THERE IS NOT ENOUGH ROOM FOR BOTH OF US",
    "AN UNKNOWN ENTITY IS TRACKING YOUR PATH"
];

const box = document.getElementById("box");
const text = document.getElementById("payload-text");

text.textContent =
    payloads[Math.floor(Math.random() * payloads.length)];

let x = Math.random() * 300;
let y = Math.random() * 200;

let vx = 5;
let vy = 4;

function animate(){
    const maxX = window.innerWidth - box.offsetWidth;
    const maxY = window.innerHeight - box.offsetHeight;

    x += vx;
    y += vy;

    if(x <= 0 || x >= maxX){
        vx *= -1;
        x = Math.max(0,Math.min(x,maxX));
    }

    if(y <= 0 || y >= maxY){
        vy *= -1;
        y = Math.max(0,Math.min(y,maxY));
    }

    box.style.transform =
        `translate3d(${x}px,${y}px,0)`;

    requestAnimationFrame(animate);
}

animate();

/* Change the warning occasionally */
setInterval(()=>{
    text.textContent =
        payloads[Math.floor(Math.random() * payloads.length)];
},1200);
</script>

</body>
</html>
