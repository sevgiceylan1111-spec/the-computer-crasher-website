<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚠ SYSTEM ALERT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #ff0000;
    font-family: monospace;
    user-select: none;
  }
  .box {
    height: 100vh;
    border: 3px solid #ff0000;
    display: flex;
    flex-direction: column;
  }
  .bar {
    background: #ff0000;
    color: #000;
    padding: 6px;
    font-weight: bold;
    font-size: 12px;
  }
  .msg {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-grow: 1;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="box">
  <div class="bar">⚠ NOTIFICATION</div>
  <div class="msg">CRITICAL SYSTEM EVENT</div>
</div>
</body>
</html>
